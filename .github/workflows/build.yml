name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  SING_BOX_VERSION: v1.13.21
  LIBBOX_TAGS: with_gvisor,with_quic,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # ista konfiguracija koju pravi aplikacija (ConfigBuilder.kt) mora proći provjeru pravog sing-boxa
      - name: Check sing-box config
        run: |
          V=${SING_BOX_VERSION#v}
          curl -fsSL -o sb.tgz https://github.com/SagerNet/sing-box/releases/download/$SING_BOX_VERSION/sing-box-$V-linux-amd64.tar.gz
          tar xzf sb.tgz
          ./sing-box-$V-linux-amd64/sing-box check -c ci/config-vless.json
          ./sing-box-$V-linux-amd64/sing-box check -c ci/config-ss.json
          echo "Konfiguracija ispravna"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # VPN motor (sing-box libbox) se gradi iz izvornog koda i čuva u kešu
      - name: Cache libbox
        id: libbox
        uses: actions/cache/restore@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ env.SING_BOX_VERSION }}-full-v1

      - uses: actions/setup-go@v5
        if: steps.libbox.outputs.cache-hit != 'true'
        with:
          go-version: '1.24.7'
          cache: false

      - name: Build libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.0.13004108" > /dev/null
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH=$PATH:$(go env GOPATH)/bin
          git clone --depth 1 --branch $SING_BOX_VERSION https://github.com/SagerNet/sing-box /tmp/sing-box
          cd /tmp/sing-box
          gomobile bind -v -o libbox.aar -target android/arm64,android/arm,android/amd64 -androidapi 23 \
            -javapkg=io.nekohasekai -libname=box -trimpath -buildvcs=false \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${SING_BOX_VERSION#v} -X internal/godebug.defaultGODEBUG=multipathtcp=0 -s -w -buildid= -checklinkname=0" \
            -tags "$LIBBOX_TAGS" ./experimental/libbox
          mkdir -p $GITHUB_WORKSPACE/app/libs
          cp libbox.aar $GITHUB_WORKSPACE/app/libs/

      - name: Save libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/libs/libbox.aar
          key: ${{ steps.libbox.outputs.cache-primary-key }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --console=plain 2>&1 | tee build.log

      # greške kao anotacije (čitljive preko API-ja)
      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A4 build.log | head -150 > err.txt || true
          python3 - <<'PY'
          lines = open('err.txt').read().splitlines()
          for i in range(0, len(lines), 15):
              chunk = '%0A'.join(l.replace('%', '%25') for l in lines[i:i+15])
              print('::error::' + chunk)
          PY

      - name: Rename APK
        run: |
          VER=0.1.${{ github.run_number }}
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Veltrix-VPN-$VER.apk
          echo "VER=$VER" >> $GITHUB_ENV
          echo "NOTES=$(git log -1 --format=%s | tr -d '\r')" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: Veltrix-VPN-APK
          path: out/*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Veltrix VPN ${{ env.VER }} (build ${{ github.run_number }})
          body: ${{ env.NOTES }}
          files: out/*.apk
          prerelease: true
