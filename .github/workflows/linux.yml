name: Linux app

on:
  push:
    branches: [main]
    paths: ['linux/**', 'windows/src/**', '.github/workflows/linux.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  SING_BOX_VERSION: v1.13.21

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }

      # jpackage za .deb treba fakeroot i binutils
      - name: Install packaging tools
        run: sudo apt-get update -y && sudo apt-get install -y fakeroot binutils

      - name: Download sing-box (VPN motor)
        run: |
          v="${SING_BOX_VERSION#v}"
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/${SING_BOX_VERSION}/sing-box-${v}-linux-amd64.tar.gz" -o sb.tgz
          mkdir -p sb && tar -xzf sb.tgz -C sb
          mkdir -p linux/resources/linux-x64
          cp "sb/sing-box-${v}-linux-amd64/sing-box" linux/resources/linux-x64/sing-box
          chmod +x linux/resources/linux-x64/sing-box
          linux/resources/linux-x64/sing-box check -c ci/config-linux.json

      - name: Build .deb
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle -p linux packageDeb --no-daemon --console=plain 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Exception" -A4 build.log | head -120 > err.txt || true
          python3 - <<'PY'
          lines = open('err.txt', encoding='utf-8', errors='ignore').read().splitlines()
          for i in range(0, len(lines), 15):
              print('::error::' + '%0A'.join(l.replace('%', '%25') for l in lines[i:i+15]))
          PY

      - name: Check package
        run: |
          deb=$(ls linux/build/compose/binaries/main/deb/*.deb | head -1)
          echo "deb: $deb"
          dpkg-deb -c "$deb" | grep -q "sing-box" || { echo "::error::sing-box nije u .deb paketu"; exit 1; }

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-${{ github.run_number }}
          name: AdiLink VPN za Linux 1.0.${{ github.run_number }}
          body: |
            Instalacija za Debian/Ubuntu/Mint (64-bit, .deb):

            1. Preuzmi .deb i instaliraj: `sudo apt install ./adilink-vpn_*.deb`
            2. Pokreni "AdiLink VPN" iz menija.
            3. Pri spajanju potvrdi zahtjev lozinkom (VPN tunel traži administratorska prava).

            Zalijepi svoj pristupni link ili skeniraj QR iz naloga.
          files: linux/build/compose/binaries/main/deb/*.deb
          prerelease: true
